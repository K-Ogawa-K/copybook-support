<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>コピペ帳 サポート</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; color: #18352f; background: #f3faf7; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; line-height: 1.75; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 20px 56px; }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    h2 { margin-top: 32px; font-size: 1.25rem; }

    .panel { margin-top: 20px; padding: 20px; border: 1px solid #cfe6dd; border-radius: 12px; background: #fff; }

<body>
  <main>
    <h1>コピペ帳 サポート</h1>
    <p>コピペ帳は、フリマ、仕事、SNSなどで使う定型文を保存し、必要なときにすぐコピーできるアプリです。</p>

    <section class="panel">
      <h2>お問い合わせ</h2>
      <p>不具合やご要望は、<a href="mailto:gazudayo@gmail.com">gazudayo@gmail.com</a>までご連絡ください。</p>
    </section>

    <section class="panel">
      <h2>データの保存</h2>
      <p>フォルダ、定型文、設定などのデータは端末内に保存されます。通常の利用中に、開発者のサーバーへ本文やタイトルを送信することはありません。</p>
      <p>バックアップを作成すると、ユーザーが選択した保存先へバックアップファイルが書き出されます。保存先や共有先での取り扱いは、そのサービスの規約とプライバシーポリシーに従います。</p>
    </section>

    <section class="panel">
      <h2>関連ページ</h2>
      <p><a href="privacy.html">プライバシーポリシー</a></p>
    </section>
